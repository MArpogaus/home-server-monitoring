name: Pre-commit

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@0bd14f535f9c11b22f20a74e5cf7c7e7634a0465 # v6.2.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@9eff26f86fe5cf0fff117c9c8d986ab3b365b155 # v3.0.1
