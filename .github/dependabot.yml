---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ['*']
