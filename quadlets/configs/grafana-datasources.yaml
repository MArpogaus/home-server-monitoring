apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://127.0.0.1:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    url: http://127.0.0.1:3100

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://127.0.0.1:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
