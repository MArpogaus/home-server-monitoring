---
groups:
  - name: containers
    interval: 1m
    rules:
      - alert: ContainerRestartLoop
        expr: |
          sum by (user_unit) (
            count_over_time({job="systemd-journal"} |= "Scheduled restart job" [15m])
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.user_unit }} has restarted repeatedly"
          description: >-
            The unit restarted more than five times in fifteen minutes, so it is
            failing rather than recovering. Check `journalctl --user -u
            {{ $labels.user_unit }}` as that service's user.

      # A unit that gives up stops restarting, so the rule above goes quiet.
      - alert: ContainerFailed
        expr: |
          sum by (user_unit) (
            count_over_time({job="systemd-journal"} |= "Failed with result" [10m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.user_unit }} is failing"


      # The backup exits 0 and logs a skip when the target is not mounted, so a
      # failure alert never fires for an absent disk. This keys on the success
      # line instead. The first clause keeps it quiet on hosts that run no
      # backup at all, where the unit logs nothing. `on()` is required: sum()
      # drops all labels while absent_over_time keeps job and unit, so a plain
      # `and` matches nothing and the alert can never fire.
      - alert: BackupStale
        expr: |
          (sum(count_over_time({job="systemd-journal", unit="btrfs-backup.service"} [7d])) > 0)
          and on()
          absent_over_time({job="systemd-journal", unit="btrfs-backup.service"} |= "run complete" [48h])
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No completed backup in 48 hours"
          description: >-
            btrfs-backup.service has not logged a completed run for 48 hours.
            The target is most likely not mounted, which the job treats as a
            skip rather than an error. Check `systemctl status btrfs-backup`
            and whether the backup disk is attached.

  - name: scheduled-jobs
    interval: 1m
    rules:
      # System units log under `unit`, not `user_unit`, so they need their own rule.
      - alert: ScheduledJobFailed
        expr: |
          sum by (unit) (
            count_over_time(
              {job="systemd-journal", unit=~"(btrfs-backup|btrfs-snapshot@.*|pg-dumpall)\\.service"}
                |= "Failed with result" [6h]
            )
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} failed"
          description: >-
            A scheduled backup, snapshot or database dump failed. Check
            `journalctl -u {{ $labels.unit }}`. Until it succeeds the data it
            protects has no fresh copy.
