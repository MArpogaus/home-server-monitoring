---
groups:
  - name: containers
    interval: 1m
    rules:
      # systemd logs "Scheduled restart job, restart counter is at N" for every
      # restart. A container that keeps failing produces one per RestartSec, so
      # a handful within fifteen minutes means a crash loop rather than a
      # one-off. This is the signal that would have caught the redis capability
      # failure, the node-exporter entrypoint and the bunkerweb health action
      # within minutes each.
      - alert: ContainerRestartLoop
        expr: |
          sum by (user_unit) (
            count_over_time({job="systemd-journal"} |= "Scheduled restart job" [15m])
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.user_unit }} has restarted repeatedly"
          description: >-
            The unit restarted more than five times in fifteen minutes, so it is
            failing rather than recovering. Check `journalctl --user -u
            {{ $labels.user_unit }}` as that service's user.

      # A unit that gives up entirely stops producing restart messages, so the
      # rule above goes quiet exactly when things are worst.
      - alert: ContainerFailed
        expr: |
          sum by (user_unit) (
            count_over_time({job="systemd-journal"} |= "Failed with result" [10m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.user_unit }} is failing"

  - name: scheduled-jobs
    interval: 1m
    rules:
      # The container rules above group by user_unit, which only rootless
      # containers have. The backup, snapshot and database dump run as system
      # units and log under `unit`, so without this a failed backup alerts
      # nobody. These run daily, so the window is long enough to catch one.
      - alert: ScheduledJobFailed
        expr: |
          sum by (unit) (
            count_over_time(
              {job="systemd-journal", unit=~"(btrfs-backup|btrfs-snapshot@.*|pg-dumpall)\\.service"}
                |= "Failed with result" [6h]
            )
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} failed"
          description: >-
            A scheduled backup, snapshot or database dump failed. Check
            `journalctl -u {{ $labels.unit }}`. Until it succeeds the data it
            protects has no fresh copy.
