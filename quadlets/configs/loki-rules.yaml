---
groups:
  - name: containers
    interval: 1m
    rules:
      # Manager messages about a user unit only: a container that quotes these
      # strings in its own output (Loki does, for its rules) must not trip them,
      # and a failed system unit has no user_unit, which left the summary nameless.
      # Podman's transient health-check units (<container id>-<hash>.service)
      # fail on every probe that exits 1, which is normal while a container starts.
      - alert: ContainerRestartLoop
        expr: |
          sum by (user_unit) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="systemd", user_unit=~".+", user_unit!~"[0-9a-f]{64}-.*"}
                |= "Scheduled restart job" [15m]
            )
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.user_unit }} has restarted repeatedly"
          description: >-
            The unit restarted more than five times in fifteen minutes, so it is
            failing rather than recovering. Check `journalctl --user -u
            {{ $labels.user_unit }}` as that service's user.

      # A unit that gives up stops restarting, so the rule above goes quiet.
      - alert: ContainerFailed
        expr: |
          sum by (user_unit) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="systemd", user_unit=~".+", user_unit!~"[0-9a-f]{64}-.*"}
                |= "Failed with result" [10m]
            )
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.user_unit }} is failing"

  - name: scheduled-jobs
    interval: 1m
    rules:
      # System units log under `unit`, not `user_unit`, so they need their own rule.
      - alert: ScheduledJobFailed
        expr: |
          sum by (unit) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="systemd", unit=~"(btrfs-backup@.*|btrfs-snapshot@.*|pg-dumpall)\\.service"}
                |~ "(?i)failed with result" [6h]
            )
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} failed"
          description: >-
            A scheduled backup, snapshot or database dump failed. Check
            `journalctl -u {{ $labels.unit }}`. Until it succeeds the data it
            protects has no fresh copy.

      # A disabled timer or a removed unit fails nothing; silence is the symptom.
      - alert: BackupMissing
        expr: |
          absent_over_time({job="systemd-journal", syslog_identifier="systemd", unit=~"btrfs-backup@.*"} |= "Deactivated successfully" [30h])
        labels:
          severity: critical
        annotations:
          summary: "No backup finished in 30 hours"

      - alert: SnapshotMissing
        expr: |
          absent_over_time({job="systemd-journal", syslog_identifier="systemd", unit=~"btrfs-snapshot@.*"} |= "Deactivated successfully" [30h])
        labels:
          severity: critical
        annotations:
          summary: "No snapshot finished in 30 hours"

      - alert: DumpMissing
        expr: |
          absent_over_time({job="systemd-journal", syslog_identifier="systemd", unit="pg-dumpall.service"} |= "Deactivated successfully" [30h])
        labels:
          severity: critical
        annotations:
          summary: "No database dump finished in 30 hours"

  - name: events
    interval: 1m
    rules:
      # Events, not states: severity info routes to ntfy without a "resolved" message.
      - alert: SshLogin
        expr: |
          sum by (user, ip) (
            count_over_time(
              {job="systemd-journal", unit="sshd.service"}
                |= "Accepted publickey"
                | pattern "Accepted publickey for <user> from <ip> port <_>" [2m]
            )
          ) > 0
        labels:
          severity: info
        annotations:
          summary: "SSH login: {{ $labels.user }} from {{ $labels.ip }}"

      - alert: HostBooted
        expr: |
          sum(count_over_time({job="systemd-journal", unit="init.scope"} |= "Startup finished in" [2m])) > 0
        labels:
          severity: info
        annotations:
          summary: "The host booted"

      - alert: UpdateStaged
        expr: |
          sum(count_over_time({job="systemd-journal", unit=~"rpm-ostreed.service|auto-reboot-staged.service"}
                |~ "[Ss]taged|Rebooting" [2m])) > 0
        labels:
          severity: info
        annotations:
          summary: "rpm-ostree staged an update or the auto-reboot fired"

      - alert: BunkerWebBan
        expr: |
          sum by (ip) (
            count_over_time(
              {job="systemd-journal", container="bunker-nginx"}
                |= "[BADBEHAVIOR]" |= "is banned for"
                | pattern "<_>[BADBEHAVIOR] IP <ip> is banned for <_>" [2m]
            )
          ) > 0
        labels:
          severity: info
        annotations:
          summary: "BunkerWeb banned {{ $labels.ip }} (bad behavior)"

      - alert: SshLoginFailed
        expr: |
          sum(count_over_time({job="systemd-journal", unit="sshd.service"}
                |~ "Invalid user|Failed (publickey|password)" [2m])) > 0
        labels:
          severity: info
        annotations:
          summary: "SSH login attempt failed"

      - alert: NextcloudLoginFailed
        expr: |
          sum by (user, ip) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="nextcloud"}
                |= "Login failed: '"
                | regexp "Login failed: '(?P<user>[^']+)' \\(Remote IP: '(?P<ip>[^']+)'\\)" [2m]
            )
          ) > 0
        labels:
          severity: info
        annotations:
          summary: "Nextcloud login failed for {{ $labels.user }} from {{ $labels.ip }}"

      - alert: BackupDone
        expr: |
          sum by (unit) (count_over_time({job="systemd-journal", syslog_identifier="systemd", unit=~"btrfs-backup@.*"}
                |= "Deactivated successfully" [2m])) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.unit }} finished"

      - alert: ImagePulled
        expr: |
          sum by (image) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="podman"}
                |= "Trying to pull"
                | pattern "Trying to pull <image>..." [2m]
            )
          ) > 0
        labels:
          severity: info
        annotations:
          summary: "podman pulled {{ $labels.image }}"

  - name: host
    interval: 1m
    rules:
      - alert: OomKill
        expr: |
          sum by (proc) (
            count_over_time(
              {job="systemd-journal", syslog_identifier="kernel"}
                |= "Killed process"
                | regexp `Killed process \d+ \((?P<proc>[^)]+)\)` [5m]
            )
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "OOM: {{ $labels.proc }} killed"
          description: "`journalctl -k | grep -B3 'Killed process'` names the container's unit in oom_memcg."

      - alert: SelinuxDenials
        expr: |
          sum(count_over_time({job="systemd-journal", syslog_identifier="audit"}
                |= "avc:  denied" != "permissive=1" != "comm=\"pasta" [15m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 20 enforced SELinux denials in 15 minutes"
          description: "`ausearch -m AVC -ts recent` on the host. pasta's capability probes at pod start are excluded."

      - alert: BunkerWebError
        expr: |
          sum(count_over_time(
            {job="systemd-journal", container=~"bunker-.*"}
              |~ "\\[(crit|alert|emerg)\\]|\\[ERROR\\]" [5m]
          )) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "BunkerWeb logged a critical error"
          description: "Check `journalctl _UID=$(id -u proxy) -p err` on the host; DNS timeouts and denied clients are not counted here."

      - alert: CertificateRenewalFailed
        expr: |
          sum(count_over_time({job="systemd-journal", container="bunker-scheduler"}
                |~ "(?i)certbot" |~ "(?i)error|fail" [30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BunkerWeb could not renew a Let's Encrypt certificate"
