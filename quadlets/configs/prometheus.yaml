global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yaml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['monitoring-node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: podman
    podman:
      filters:
        - name: label
          content: "io.containers.autoupdate=registry"
    relabel_configs:
      - source_labels: ['__meta_podman_container_name']
        target_label: 'container'
      - source_labels: ['__meta_podman_container_image']
        target_label: 'image'
