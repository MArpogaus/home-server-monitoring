global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

# All targets share the pod's network namespace.
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']

  - job_name: alloy
    static_configs:
      - targets: ['127.0.0.1:12345']
