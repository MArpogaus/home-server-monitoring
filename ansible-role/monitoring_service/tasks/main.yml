---
- name: Assert the ntfy credentials are set
  ansible.builtin.assert:
    that:
      - monitoring_service_ntfy_password | length > 0
      - monitoring_service_ntfy_token is match('^tk_[a-z0-9]{29}$')
      - monitoring_service_grafana_admin_password | length > 0
    fail_msg: >-
      Set monitoring_service_ntfy_password, monitoring_service_ntfy_token
      (tk_ plus 29 lowercase letters or digits) and
      monitoring_service_grafana_admin_password in secrets/vars.yml. Without
      the first two nobody can publish or read alerts; without the third
      Grafana keeps admin/admin, which the proxy pod can reach.
    quiet: true

- name: Deploy the Quadlets
  ansible.builtin.import_role:
    name: quadlet_service

# The pod starts asynchronously and a first deploy still has images to pull, so
# the play would otherwise report success while nothing answers yet.
- name: Wait for the monitoring stack to answer
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  loop:
    - http://127.0.0.2:3100/ready
    - http://127.0.0.2:3000/api/health
    - http://127.0.0.2:9090/-/ready
  register: monitoring_service_ready
  until: monitoring_service_ready is success
  retries: 30
  delay: 10

# GF_SECURITY_ADMIN_PASSWORD applies to a fresh database only.
- name: Try the Grafana admin password
  ansible.builtin.uri:
    url: http://127.0.0.2:3000/api/org
    user: admin
    password: "{{ monitoring_service_grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: monitoring_service_grafana_login
  when: monitoring_service_grafana_admin_password | length > 0
  no_log: true

# --password-from-stdin, so the value never reaches /proc/<pid>/cmdline.
- name: Set the Grafana admin password
  ansible.builtin.command:
    cmd: podman exec -i monitoring-grafana grafana cli admin reset-admin-password --password-from-stdin
    stdin: "{{ monitoring_service_grafana_admin_password }}"
    stdin_add_newline: false
  become: true
  become_user: "{{ service_user }}"
  when:
    - monitoring_service_grafana_admin_password | length > 0
    - monitoring_service_grafana_login.status == 401
  changed_when: true
  no_log: true
