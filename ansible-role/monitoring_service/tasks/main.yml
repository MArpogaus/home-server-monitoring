---
# Monitoring service deployment — fully self-contained
# Receives: service_name, service_user, service_uid, service_home, service_repo

- name: Deploy static Quadlet files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - monitoring.pod
    - shared-network.network

- name: Template container Quadlet files (strip .j2)
  ansible.builtin.template:
    src: "{{ service_repo }}/quadlets/{{ item }}.j2"
    dest: "{{ service_home }}/.config/containers/systemd/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - monitoring-grafana.container
    - monitoring-loki.container
    - monitoring-node-exporter.container
    - monitoring-prometheus.container

- name: Ensure configs directory exists
  ansible.builtin.file:
    path: "{{ service_home }}/.config/containers/systemd/configs"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Ensure dashboards directory exists
  ansible.builtin.file:
    path: "{{ service_home }}/.config/containers/systemd/configs/dashboards"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Deploy config files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/configs/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - loki.yaml
    - prometheus.yaml
    - prometheus-rules.yaml
    - grafana-datasources.yaml
    - grafana-dashboards.yaml

- name: Deploy dashboard JSON files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/configs/dashboards/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/dashboards/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - node-exporter.json

- name: Reload systemd user daemon
  ansible.builtin.command:
    cmd: "machinectl shell {{ service_user }}@ /usr/bin/systemctl --user daemon-reload"
  changed_when: true
  failed_when: false

- name: Restart user manager (triggers Quadlet generator and starts containers)
  ansible.builtin.systemd:
    name: "user@{{ service_uid }}.service"
    state: restarted
    scope: system
  failed_when: false
