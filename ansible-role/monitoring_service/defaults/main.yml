---
monitoring_service_grafana_image: "docker.io/grafana/grafana:13.2.2"
monitoring_service_loki_image: "docker.io/grafana/loki:3.7.8"
monitoring_service_alloy_image: "docker.io/grafana/alloy:v1.19.2"
monitoring_service_prometheus_image: "docker.io/prom/prometheus:v3.14.0"
monitoring_service_alertmanager_image: "docker.io/prom/alertmanager:v0.34.1"
monitoring_service_node_exporter_image: "docker.io/prom/node-exporter:v1.12.1"
monitoring_service_blackbox_image: "docker.io/prom/blackbox-exporter:v0.28.0"

monitoring_service_probe_urls: []

# Required.
monitoring_service_grafana_admin_password: ""

monitoring_service_host_ports: []
# Empty: alerts stay in Grafana.
monitoring_service_alert_webhook_url: ""
monitoring_service_alert_webhook_token: ""

# Grafana's environment (GF_*), merged over monitoring_service_config_defaults in vars/main.yml.
monitoring_service_config: {}
# Memory ceilings per container, merged over monitoring_service_memory_defaults.
monitoring_service_memory: {}
