---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        # A .j2 shebang belongs to the rendered file, not to the template.
        exclude: \.j2$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # ansible-lint owns YAML style, so no YAML formatter runs beside it.
  - repo: https://github.com/ansible/ansible-lint
    rev: e7f397ad6dfa20d274afa17cd7bbedd84ed136f5  # frozen: v26.9.0
    hooks:
      - id: ansible-lint

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 054e4a278e11abb9b8df6c103fa64f544d468ee5  # frozen: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]
